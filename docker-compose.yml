services:
  databencana:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: databencana-landing
    restart: unless-stopped
    ports:
      - "19001:3000"    # host:container — port 67+3000 = 63000 (sesuai konvensi port 67 prefix)
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health", "||", "exit", "1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  default:
    name: databencana-network
